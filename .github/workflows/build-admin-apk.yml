name: Build Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/android-admin/**'
      - '.github/workflows/build-admin-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle wrapper
        working-directory: build/android-admin
        run: |
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: build/android-admin
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p build/apk
          APK=$(ls build/android-admin/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" build/apk/StudioAdmin-1.5.0.apk
          ls -la build/apk/

      - uses: actions/upload-artifact@v4
        with:
          name: StudioAdmin-apk
          path: build/apk/StudioAdmin-1.5.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-v1.5.0
          name: Studio Admin APK v1.5.0
          body: |
            Artist's Studio Admin Android app (API-only).
            Gate, Login, Dashboard, Chat, Contacts, Notifications, CMS, Security.
          files: build/apk/StudioAdmin-1.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
